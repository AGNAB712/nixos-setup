<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b0f14;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: 0;
      display: block;
      overflow: hidden;
      background: transparent;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #e6edf3;
      background: #0b0f14;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .fallback-content {
      max-width: 560px;
    }

    .fallback h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 650;
    }

    .fallback p {
      margin: 0;
      color: #9fb0c0;
    }

    .fallback a {
      color: #79c0ff;
    }
  </style>
</head>
<body>
  <div class="fallback">
    <div class="fallback-content">
      <h1>Dashboard could not be displayed</h1>
      <p>
        LibreWolf may be blocking the iframe, or the dashboard may be offline.
        Open <a href="http://homeserver.local:3000">http://homeserver.local:3000</a> directly to check it.
      </p>
    </div>
  </div>
  <iframe
    id="dashboard"
    src="http://homeserver.local:3000"
    title="Home server dashboard"
    referrerpolicy="no-referrer"
    scrolling="no">
    Dashboard could not be displayed. Open http://homeserver.local:3000 directly to check it.
  </iframe>
</body>
</html>
